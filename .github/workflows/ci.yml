name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Verification Suite
        run: bun run check

      - name: Apply Migrations (Ephemeral CI SQLite)
        run: bun run db:migrate
        env:
          DATABASE_URL: file:./ci.db

      - name: Production Build
        run: bun run build
        env:
          DATABASE_URL: file:./ci.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-32chars
          BETTER_AUTH_URL: http://localhost:3000
          SPOTIFY_CLIENT_ID: ci-placeholder
          SPOTIFY_CLIENT_SECRET: ci-placeholder
          SPOTIFY_REFRESH_TOKEN: ci-placeholder
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
          BLOB_READ_WRITE_TOKEN: ci-placeholder
          NEXT_TELEMETRY_DISABLED: '1'
